<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>乙女抓播放器 · Otome Scenario Player</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #16161a;
    --panel-2: #1d1d22;
    --line: #2a2a31;
    --text: #eeeef2;
    --muted: #8b8b96;
    --accent: #e682b4;
    --accent-soft: rgba(230, 130, 180, 0.14);
    --ok: #7ee0b0;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  header { margin-bottom: 28px; }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .logo .dot { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .add-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .add-box svg { flex: none; color: var(--muted); }
  #linkInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
  }
  #linkInput::placeholder { color: #5b5b66; }
  #addBtn {
    flex: none;
    background: var(--accent);
    color: #1a0d13;
    border: none;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  #addBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #addBtn:not(:disabled):hover { opacity: 0.88; }

  .hint { margin-top: 10px; min-height: 18px; font-size: 12.5px; color: var(--muted); }
  .chip {
    display: inline-block;
    margin-right: 8px;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .chip[data-p="youtube"] { background: rgba(255,0,0,0.15); color: #ff7b7b; }
  .chip[data-p="dlsite"] { background: rgba(255,170,0,0.16); color: #ffc25e; }
  .chip[data-p="reddit"] { background: rgba(255,69,0,0.16); color: #ff8a5a; }

  .card {
    margin-top: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .card.show { display: block; }

  .meta {
    display: flex;
    gap: 16px;
    padding: 16px;
    align-items: center;
  }
  .cover {
    width: 92px;
    height: 92px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--panel-2);
    flex: none;
  }
  .meta-body { min-width: 0; }
  .meta-body .t {
    font-size: 16px;
    font-weight: 650;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta-body .a { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .meta-body .tags { margin-top: 8px; }
  .tag {
    display: inline-block;
    margin: 2px 6px 2px 0;
    padding: 1px 8px;
    font-size: 11.5px;
    color: var(--muted);
    background: var(--panel-2);
    border-radius: 6px;
  }

  .player {
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
  }
  .player iframe, .player video { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  .player.landscape { aspect-ratio: 16 / 9; }
  .player.portrait { aspect-ratio: 9 / 16; width: min(100%, 40vh); max-height: 68vh; margin: 0 auto; }
  .player:fullscreen, .player:-webkit-full-screen { aspect-ratio: auto; width: 100%; height: 100%; max-height: none; margin: 0; }

  .mode-toggle { padding: 12px 16px 0; }
  .mode-toggle[hidden] { display: none; }
  .mode-toggle .seg {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
  }
  .mode-toggle .seg button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 9px 0;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .mode-toggle .seg button.active { background: var(--accent); color: #1a0d13; font-weight: 650; }

  .video-ctl { display: none; gap: 8px; }
  .video-ctl.show { display: inline-flex; }

  .subpanel {
    display: none;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    max-height: 260px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.7;
    color: #c9c9d2;
  }
  .subpanel.show { display: block; }
  .subpanel .cap-line { margin-bottom: 6px; }
  .subpanel .cap-line b { color: var(--accent); margin-right: 8px; font-weight: 600; }

  .actions {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .actions a, .actions button {
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .actions a:hover, .actions button:hover { border-color: var(--accent); }
  .actions button.danger { color: #ff8a8a; }

  .note {
    margin-top: 12px;
    padding: 12px 16px;
    background: var(--accent-soft);
    border: 1px solid rgba(230,130,180,0.25);
    border-radius: var(--radius);
    font-size: 13px;
    color: #f6c8dc;
    display: none;
  }
  .note.show { display: block; }

  .list { margin-top: 30px; }
  .list h3 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-bottom: 12px; }
  .item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 11px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .item:hover { border-color: var(--accent); }
  .item .c { width: 44px; height: 44px; border-radius: 7px; object-fit: cover; background: var(--panel-2); flex: none; }
  .item .b { min-width: 0; flex: 1; }
  .item .b .t { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .b .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .x { color: var(--muted); background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .item .x:hover { color: #ff8a8a; }
  .empty { color: #55555f; font-size: 13px; text-align: center; padding: 24px; }

  .toast {
    position: fixed;
    left: 50%; bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: #202027;
    color: var(--text);
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    border: 1px solid var(--line);
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    max-width: 80vw;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spin { animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">乙女抓<span class="dot">·</span>播放器</div>
    <div class="sub">粘贴 YouTube / DLsite / Reddit 链接，即点即播、自动字幕</div>
  </header>

  <div class="add-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    <input id="linkInput" placeholder="粘贴链接，例如 https://youtu.be/xxxx 或 DLsite 的 RJ 链接" autocomplete="off" spellcheck="false" />
    <button id="addBtn" disabled>播放</button>
  </div>
  <div class="hint" id="hint">支持 youtu.be / youtube.com / dlsite.com / reddit 链接</div>

  <div class="card" id="card">
    <div class="meta">
      <img class="cover" id="cover" alt="" />
      <div class="meta-body">
        <div class="t" id="title">—</div>
        <div class="a" id="artist"></div>
        <div class="tags" id="tags"></div>
      </div>
    </div>
    <div class="mode-toggle" id="modeToggle" hidden>
      <div class="seg">
        <button id="modeAudio" type="button" class="active">音频</button>
        <button id="modeVideo" type="button">视频</button>
      </div>
    </div>
    <div class="player landscape" id="player"></div>
    <div class="actions">
      <a id="openLink" href="#" target="_blank" rel="noopener">打开原页面 ↗</a>
      <span class="video-ctl" id="videoCtl">
        <button id="fsBtn" type="button">全屏播放</button>
        <button id="fsPortraitBtn" type="button">竖屏全屏</button>
      </span>
      <button id="capBtn" type="button">字幕</button>
      <button id="favoriteBtn" type="button">收藏</button>
      <button id="closeBtn" type="button" class="danger">关闭</button>
    </div>
    <div class="subpanel" id="subpanel"></div>
  </div>

  <div class="note" id="note"></div>

  <div class="list">
    <h3>收藏</h3>
    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var input = $("linkInput"), addBtn = $("addBtn"), hint = $("hint");
  var card = $("card"), cover = $("cover"), titleEl = $("title"), artistEl = $("artist"), tagsEl = $("tags");
  var player = $("player"), openLink = $("openLink"), note = $("note"), listEl = $("list");
  var modeToggle = $("modeToggle"), modeAudio = $("modeAudio"), modeVideo = $("modeVideo");
  var videoCtl = $("videoCtl"), fsBtn = $("fsBtn"), fsPortraitBtn = $("fsPortraitBtn");
  var capBtn = $("capBtn"), subpanel = $("subpanel");
  var current = null;
  var currentMode = "audio";
  var transcriptFetched = false;

  // ── 平台识别 ──
  function detect(raw) {
    var s = (raw || "").trim();
    if (!s) return null;
    var url = /^https?:\/\//i.test(s) ? s : "https://" + s;
    var u;
    try { u = new URL(url); } catch (e) { return null; }
    var host = u.hostname.toLowerCase();

    // YouTube
    if (host.indexOf("youtube.com") >= 0 || host.indexOf("youtu.be") >= 0 || host.indexOf("youtube-nocookie.com") >= 0) {
      var id = "";
      if (host === "youtu.be" || host.lastIndexOf("youtu.be") === host.length - 8) {
        id = u.pathname.slice(1).split("/")[0];
      } else {
        id = u.searchParams.get("v") || "";
        if (!id) {
          var parts = u.pathname.split("/").filter(Boolean);
          var i = parts.findIndex(function (p) { return ["shorts", "embed", "v", "live"].indexOf(p) >= 0; });
          if (i >= 0 && parts[i + 1]) id = parts[i + 1];
        }
      }
      if (!/^[\w-]{11}$/.test(id)) return null;
      return { platform: "youtube", id: id, canonical: "https://www.youtube.com/watch?v=" + id };
    }

    // DLsite
    if (host.indexOf("dlsite.com") >= 0) {
      var m = (u.pathname + " " + u.search).match(/\b((?:RJ|RE|BJ|VJ)\d{5,8})\b/i);
      var code = m ? m[1].toUpperCase() : "";
      if (!code) {
        var pid = u.searchParams.get("product_id");
        if (pid) code = pid.toUpperCase();
      }
      if (!code) return null;
      return { platform: "dlsite", id: code, canonical: "https://www.dlsite.com/maniax/work/=/product_id/" + code + ".html" };
    }

    // Reddit
    if (host.indexOf("reddit.com") >= 0 || host.lastIndexOf("redd.it") === host.length - 7) {
      var pid2 = "";
      if (host.indexOf("reddit.com") >= 0) {
        var ps = u.pathname.split("/").filter(Boolean);
        var c = ps.indexOf("comments");
        pid2 = (c >= 0 && ps[c + 1]) ? ps[c + 1] : (ps[0] || "");
      } else {
        pid2 = u.pathname.slice(1).split("/")[0];
      }
      if (!pid2) return null;
      return { platform: "reddit", id: pid2, canonical: "https://www.reddit.com/comments/" + pid2 };
    }

    return null;
  }

  function chipHtml(p) {
    var label = { youtube: "YouTube", dlsite: "DLsite", reddit: "Reddit" }[p];
    return '<span class="chip" data-p="' + p + '">' + label + "</span>";
  }

  function toast(msg, ms) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove("show"); }, ms || 2600);
  }

  function setHint(p) {
    if (!p) { hint.innerHTML = "支持 youtu.be / youtube.com / dlsite.com / reddit 链接"; return; }
    var txt = {
      youtube: "识别为 YouTube 视频 · 播放器右下角 CC 可开启日语字幕",
      dlsite: "识别为 DLsite 作品（RJ 编号），浏览器跨域限制下请点「打开原页面」查看试听",
      reddit: "识别为 Reddit 帖子，有内嵌视频将直接播放",
    }[p];
    hint.innerHTML = chipHtml(p) + txt;
  }

  // ── YouTube 元数据（oembed 支持 CORS）──
  function fetchYtMeta(id) {
    var urls = [
      "https://www.youtube.com/oembed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id) + "&format=json",
      "https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id)
    ];
    return fetch(urls[0]).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .catch(function () { return fetch(urls[1]).then(function (r) { return r.ok ? r.json() : Promise.reject(); }); })
      .then(function (d) {
        return { title: d.title, author: d.author_name || d.author, thumb: d.thumbnail_url || "" };
      })
      .catch(function () {
        return { title: "YouTube " + id, author: "YouTube", thumb: "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg" };
      });
  }

  // ── Reddit 元数据（.json 支持 CORS）──
  function fetchRedditMeta(postId) {
    var urls = [
      "https://www.reddit.com/comments/" + postId + ".json?raw_json=1&limit=1",
      "https://old.reddit.com/comments/" + postId + ".json?raw_json=1&limit=1"
    ];
    function tryFetch(i) {
      return fetch(urls[i], { headers: { "Accept": "application/json" } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .catch(function () { return i + 1 < urls.length ? tryFetch(i + 1) : Promise.reject(); });
    }
    return tryFetch(0).then(function (j) {
      var d = j && j[0] && j[0].data && j[0].data.children && j[0].data.children[0] && j[0].data.children[0].data;
      if (!d) return null;
      var rv = (d.secure_media && d.secure_media.reddit_video) || (d.media && d.media.reddit_video);
      var thumb = (d.preview && d.preview.images && d.preview.images[0] && d.preview.images[0].source && d.preview.images[0].source.url) || "";
      if (thumb) thumb = thumb.replace(/&amp;/g, "&");
      return {
        title: d.title,
        author: d.subreddit ? "r/" + d.subreddit : "Reddit",
        thumb: thumb,
        video: rv ? (rv.fallback_url || "").split("?")[0] : "",
        permalink: d.permalink ? "https://www.reddit.com" + d.permalink : ""
      };
    }).catch(function () { return null; });
  }

  // ── YouTube 播放器 / 字幕 ──
  function ytEmbedSrc(id) {
    var params = { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1, cc_load_policy: 1, cc_lang_pref: "ja", hl: "ja" };
    return "https://www.youtube.com/embed/" + id + "?" +
      Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
  }

  function renderYoutubePlayer(det) {
    player.className = "player landscape";
    player.innerHTML = "";
    var ifr = document.createElement("iframe");
    ifr.src = ytEmbedSrc(det.id);
    ifr.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    ifr.allowFullscreen = true;
    ifr.setAttribute("title", "video player");
    player.appendChild(ifr);
  }

  function formatTime(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function fetchTranscript(id) {
    var langs = ["ja", "zh-Hans", "en"];
    var proxies = [
      function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
      function (u) { return "https://corsproxy.io/?url=" + encodeURIComponent(u); }
    ];
    function attempt(langIdx, proxyIdx) {
      if (langIdx >= langs.length) return Promise.reject(new Error("no captions"));
      var lang = langs[langIdx];
      var tt = "https://www.youtube.com/api/timedtext?v=" + id + "&lang=" + lang + "&fmt=json3";
      return fetch(proxies[proxyIdx](tt))
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (j) {
          if (!j || !Array.isArray(j.events) || !j.events.length) return Promise.reject();
          var lines = [];
          j.events.forEach(function (ev) {
            if (ev.segs) {
              var txt = ev.segs.map(function (s) { return s.utf8 || ""; }).join("");
              if (txt) lines.push({ t: ev.tStartMs ? Math.round(ev.tStartMs / 1000) : 0, text: txt });
            }
          });
          return { lang: lang, lines: lines };
        })
        .catch(function () {
          if (proxyIdx + 1 < proxies.length) return attempt(langIdx, proxyIdx + 1);
          return attempt(langIdx + 1, 0);
        });
    }
    return attempt(0, 0);
  }

  function renderTranscript(data) {
    subpanel.innerHTML = "";
    var h = document.createElement("div");
    h.style.cssText = "margin-bottom:8px;color:var(--accent);font-weight:650;";
    h.textContent = "字幕文本（" + data.lang + "）";
    subpanel.appendChild(h);
    data.lines.forEach(function (l) {
      var d = document.createElement("div");
      d.className = "cap-line";
      var b = document.createElement("b");
      b.textContent = formatTime(l.t);
      d.appendChild(b);
      d.appendChild(document.createTextNode(l.text));
      subpanel.appendChild(d);
    });
    subpanel.classList.add("show");
    transcriptFetched = true;
  }

  // ── 渲染 ──
  function renderResult(det, meta) {
    current = { platform: det.platform, id: det.id, canonical: det.canonical, meta: meta };
    card.classList.add("show");
    note.classList.remove("show");
    note.textContent = "";
    openLink.href = det.canonical;

    titleEl.textContent = meta.title || ("链接 " + det.platform);
    artistEl.textContent = meta.author || "";
    tagsEl.innerHTML = "";
    cover.src = meta.thumb || "";
    cover.onerror = function () { this.style.visibility = "hidden"; };
    cover.onload = function () { this.style.visibility = "visible"; };

    player.innerHTML = "";
    player.className = "player landscape";
    modeToggle.hidden = true;
    capBtn.style.display = "none";
    subpanel.classList.remove("show");
    subpanel.innerHTML = "";
    transcriptFetched = false;
    setMode("audio");

    if (det.platform === "youtube") {
      modeToggle.hidden = false;
      capBtn.style.display = "";
      renderYoutubePlayer(det);
      note.classList.add("show");
      note.textContent = "上方可切换 音频 / 视频 模式；视频模式支持全屏与竖屏全屏。字幕默认日语优先（播放器右下角 CC），下方「字幕」按钮可尝试抓取字幕文本。";
      fetchTranscript(det.id).then(renderTranscript).catch(function () {
        subpanel.innerHTML = "";
        subpanel.classList.remove("show");
      });
    } else if (det.platform === "reddit" && meta.video) {
      var v = document.createElement("video");
      v.src = meta.video;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      player.appendChild(v);
      note.classList.add("show");
      note.textContent = "已加载 Reddit 内嵌视频（含音轨）。若无声，请点「打开原页面」查看。";
    } else if (det.platform === "reddit") {
      player.innerHTML = '<div class="empty" style="padding:40px">该帖子没有可直接播放的内嵌视频（可能是图文或外链帖），请点「打开原页面」。</div>';
    } else if (det.platform === "dlsite") {
      player.innerHTML = '<div class="empty" style="padding:40px">DLsite 试听/封面需登录或服务端代理才能抓取。点下方「打开原页面」可查看作品并在站内试听；正版音频请购买后本地播放。</div>';
      note.classList.add("show");
      note.textContent = "DLsite：浏览器跨域限制，无法直接抓取封面/标题/试听。要改成能自动抓取，需要一个后端代理（等同于之前 Next 版里 /api/music/resolve 做的事）。";
    }
  }

  // ── 收藏 ──
  function loadFavs() {
    try { return JSON.parse(localStorage.getItem("otome-favs") || "[]"); } catch (e) { return []; }
  }
  function saveFavs(arr) { try { localStorage.setItem("otome-favs", JSON.stringify(arr)); } catch (e) {} }
  function renderList() {
    var favs = loadFavs();
    if (!favs.length) { listEl.innerHTML = '<div class="empty">还没有收藏，添加后点「收藏」即可保存</div>'; return; }
    var html = "";
    favs.forEach(function (f, i) {
      html += '<div class="item" data-i="' + i + '">' +
        '<img class="c" src="' + (f.thumb || "") + '" onerror="this.style.visibility=\'hidden\'" />' +
        '<div class="b"><div class="t">' + esc(f.title || "") + '</div><div class="a">' + esc(f.author || "") + "</div></div>" +
        '<button class="x" data-del="' + i + '" title="删除">×</button></div>';
    });
    listEl.innerHTML = html;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ── 事件 ──
  var detected = null;
  input.addEventListener("input", function () {
    detected = detect(input.value);
    setHint(detected ? detected.platform : null);
    addBtn.disabled = !detected;
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && detected) { e.preventDefault(); play(detected); }
  });

  addBtn.addEventListener("click", function () { if (detected) play(detected); });

  function play(det) {
    addBtn.disabled = true;
    addBtn.textContent = "加载中…";
    var done = function () { addBtn.textContent = "播放"; addBtn.disabled = !detected; };

    if (det.platform === "youtube") {
      fetchYtMeta(det.id).then(function (m) {
        renderResult(det, { title: m.title, author: m.author, thumb: m.thumb || ("https://i.ytimg.com/vi/" + det.id + "/hqdefault.jpg") });
        done();
      });
    } else if (det.platform === "reddit") {
      fetchRedditMeta(det.id).then(function (m) {
        if (!m) m = { title: "Reddit " + det.id, author: "Reddit", thumb: "", video: "" };
        renderResult(det, m);
        if (!m.permalink) openLink.href = det.canonical;
        done();
      });
    } else if (det.platform === "dlsite") {
      renderResult(det, { title: "DLsite 作品 " + det.id, author: "DLsite", thumb: "" });
      done();
    }
  }

  $("favoriteBtn").addEventListener("click", function () {
    if (!current) return;
    var favs = loadFavs();
    if (!favs.some(function (f) { return f.platform === current.platform && f.id === current.id; })) {
      favs.unshift({ platform: current.platform, id: current.id, canonical: current.canonical, title: current.meta.title, author: current.meta.author, thumb: current.meta.thumb });
      saveFavs(favs);
      renderList();
      toast("已收藏");
    } else {
      toast("已经在收藏里了");
    }
  });

  $("closeBtn").addEventListener("click", function () {
    card.classList.remove("show");
    player.innerHTML = "";
    modeToggle.hidden = true;
    videoCtl.classList.remove("show");
    capBtn.style.display = "none";
    subpanel.classList.remove("show");
    subpanel.innerHTML = "";
    transcriptFetched = false;
    current = null;
  });

  // ── 播放模式切换 / 全屏 / 字幕 ──
  function setMode(mode) {
    currentMode = mode;
    modeAudio.classList.toggle("active", mode === "audio");
    modeVideo.classList.toggle("active", mode === "video");
    videoCtl.classList.toggle("show", mode === "video");
    if (mode === "audio") {
      player.classList.remove("portrait");
      player.classList.add("landscape");
    }
  }

  modeAudio.addEventListener("click", function () { setMode("audio"); });
  modeVideo.addEventListener("click", function () { setMode("video"); });

  function requestFullscreen(portrait) {
    if (portrait) {
      player.classList.remove("landscape");
      player.classList.add("portrait");
    } else {
      player.classList.remove("portrait");
      player.classList.add("landscape");
    }
    var fs = player.requestFullscreen || player.webkitRequestFullscreen || player.msRequestFullscreen;
    if (fs) { fs.call(player); }
    else { toast("当前浏览器不支持全屏"); }
  }

  fsBtn.addEventListener("click", function () { requestFullscreen(false); });
  fsPortraitBtn.addEventListener("click", function () { requestFullscreen(true); });

  function onFsExit() {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
      player.classList.remove("portrait");
      player.classList.add("landscape");
    }
  }
  document.addEventListener("fullscreenchange", onFsExit);
  document.addEventListener("webkitfullscreenchange", onFsExit);

  capBtn.addEventListener("click", function () {
    if (!current || current.platform !== "youtube") { toast("暂仅支持 YouTube 字幕"); return; }
    if (transcriptFetched) {
      subpanel.classList.toggle("show");
      return;
    }
    capBtn.textContent = "抓取中…";
    fetchTranscript(current.id).then(function (data) {
      renderTranscript(data);
      capBtn.textContent = "字幕";
    }).catch(function () {
      subpanel.innerHTML = "";
      subpanel.classList.remove("show");
      transcriptFetched = false;
      capBtn.textContent = "字幕";
      toast("自动抓取字幕失败，请用播放器右下角 CC 按钮查看");
    });
  });

  listEl.addEventListener("click", function (e) {
    var del = e.target.getAttribute && e.target.getAttribute("data-del");
    if (del != null) {
      var favs = loadFavs();
      favs.splice(+del, 1);
      saveFavs(favs);
      renderList();
      return;
    }
    var item = e.target.closest(".item");
    if (!item) return;
    var i = +item.getAttribute("data-i");
    var f = loadFavs()[i];
    if (!f) return;
    var det = { platform: f.platform, id: f.id, canonical: f.canonical };
    detected = det;
    setHint(det.platform);
    if (f.platform === "youtube") {
      renderResult(det, { title: f.title, author: f.author, thumb: f.thumb });
    } else if (f.platform === "reddit") {
      fetchRedditMeta(f.id).then(function (m) { renderResult(det, m || { title: f.title, author: f.author, thumb: f.thumb, video: "" }); });
    } else {
      renderResult(det, { title: f.title, author: f.author, thumb: f.thumb });
    }
  });

  renderList();
})();
</script>
</body>
</html>
